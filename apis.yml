aid: inception
name: Inception
description: >-
  Inception Labs builds diffusion-based large language models (dLLMs) branded
  Mercury. Unlike autoregressive models that emit tokens one at a time, Mercury
  generates many tokens in parallel through discrete diffusion, running 5-10x
  faster at roughly half the cost of comparable frontier models. The Inception
  API is OpenAI-compatible and exposes chat completions (Mercury 2, a reasoning
  dLLM with a 128K context, tool calling, and structured outputs), plus
  fill-in-the-middle and next-edit code completions (Mercury Edit 2) for
  IDE-style autocomplete. It ships official Python and TypeScript SDKs, a
  streaming/diffusion mode, and enterprise deployment via the Inception API,
  AWS Bedrock, and Azure AI Foundry. Backed by Amplify Partners.
